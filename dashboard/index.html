<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Daegu Agent Crew 팀 대시보드 — 프로젝트, 태스크, 결정 로그, 팀 현황">
  <title>팀 대시보드 — Daegu Agent Crew</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="https://daegu-agent-crew.github.io/agent_builder_public/" class="logo">
        📋 팀 대시보드
      </a>
      <nav class="desktop-nav">
        <a href="#overview">개요</a>
        <a href="#wiki">위키</a>
        <a href="#timeline">타임라인</a>
        <a href="#projects">프로젝트</a>
        <a href="#tasks">태스크</a>
        <a href="#decisions">결정 로그</a>
        <a href="#members">멤버</a>
        <a href="#records">기록</a>
      </nav>
    </div>
  </header>

  <main class="dashboard-main">
    <div id="loading" class="loading">불러오는 중...</div>
    <div id="error" class="error" style="display:none"></div>

    <div id="content" style="display:none">

      <section id="overview" class="section">
        <div class="section-inner">
          <div class="section-title-wrap">
            <h2 class="section-title">📊 팀 개요</h2>
            <button class="help-btn" data-help="overview" aria-label="도움말">?</button>
          </div>
          <div class="stats-grid" id="stats-grid"></div>
        </div>
      </section>

      <section id="wiki" class="section">
        <div class="section-inner">
          <div class="section-title-wrap">
            <h2 class="section-title">📖 위키 요약</h2>
            <button class="help-btn" data-help="wiki" aria-label="도움말">?</button>
          </div>
          <p class="section-desc">각 프로젝트의 현재 컨텍스트 요약</p>
          <div id="wiki-content" class="wiki-container"></div>
        </div>
      </section>

      <section id="timeline" class="section">
        <div class="section-inner">
          <div class="section-title-wrap">
            <h2 class="section-title">🕐 타임라인</h2>
            <button class="help-btn" data-help="timeline" aria-label="도움말">?</button>
          </div>
          <p class="section-desc">팀 활동을 시간순으로 정리합니다</p>
          <div id="timeline-list" class="timeline"></div>
          <div id="no-timeline" class="empty-state" style="display:none">공개 기록이 없습니다.</div>
        </div>
      </section>

      <section id="projects" class="section">
        <div class="section-inner">
          <div class="section-title-wrap">
            <h2 class="section-title">🚀 프로젝트</h2>
            <button class="help-btn" data-help="projects" aria-label="도움말">?</button>
          </div>
          <div id="projects-list" class="card-grid"></div>
        </div>
      </section>

      <section id="tasks" class="section">
        <div class="section-inner">
          <div class="section-title-wrap">
            <h2 class="section-title">✅ 태스크</h2>
            <button class="help-btn" data-help="tasks" aria-label="도움말">?</button>
          </div>
          <div id="tasks-list" class="task-list"></div>
          <div id="no-tasks" class="empty-state" style="display:none">
            아직 추적 중인 태스크가 없습니다.
          </div>
        </div>
      </section>

      <section id="decisions" class="section">
        <div class="section-inner">
          <div class="section-title-wrap">
            <h2 class="section-title">📜 결정 로그</h2>
            <button class="help-btn" data-help="decisions" aria-label="도움말">?</button>
          </div>
          <p class="section-desc">팀의 결정과 그 배경을 기록합니다</p>
          <div id="decisions-list" class="decision-list"></div>
          <div id="no-decisions" class="empty-state" style="display:none">
            아직 기록된 결정이 없습니다.
          </div>
        </div>
      </section>

      <section id="members" class="section">
        <div class="section-inner">
          <div class="section-title-wrap">
            <h2 class="section-title">👥 팀 멤버</h2>
            <button class="help-btn" data-help="members" aria-label="도움말">?</button>
          </div>
          <div id="members-list" class="member-grid"></div>
        </div>
      </section>

      <section id="records" class="section">
        <div class="section-inner">
          <div class="section-title-wrap">
            <h2 class="section-title">📂 전체 기록</h2>
            <button class="help-btn" data-help="records" aria-label="도움말">?</button>
          </div>
          <div id="records-tabs" class="tab-bar"></div>
          <div id="records-content" class="records-content"></div>
        </div>
      </section>

    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>Daegu Agent Crew · <span id="generated-time"></span> 업데이트</p>
    </div>
  </footer>

  <script src="dashboard.js"></script>
</body>
</html>
