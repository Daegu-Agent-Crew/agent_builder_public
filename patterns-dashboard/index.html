<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="담화 패턴 분석 대시보드 — 사고법 카탈로그, 분석 히스토리, 화자 지형">
  <title>패턴 분석 대시보드 — Daegu Agent Crew</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="../dashboard/" class="logo">📋 패턴 분석</a>
      <button class="menu-toggle" id="menuToggle" aria-label="메뉴">☰</button>
      <nav class="desktop-nav" id="mainNav">
        <a href="#overview">개요</a>
        <a href="#catalog">패턴 카탈로그</a>
        <a href="#timeline">분석 히스토리</a>
        <a href="#speakers">화자 지형</a>
        <a href="../youtube-dashboard/" class="nav-badge red">📺 영상 요약 →</a>
        <a href="../dashboard/" class="nav-badge blue">📋 팀 대시보드 →</a>
      </nav>
    </div>
  </header>

  <main class="dashboard-main">
    <div id="loading" class="loading">불러오는 중...</div>
    <div id="error" class="error" style="display:none"></div>
    <div id="content" style="display:none">

      <!-- Overview -->
      <section id="overview" class="section">
        <h2 class="section-title">개요</h2>
        <div class="stat-grid" id="statGrid"></div>
      </section>

      <!-- Pattern Catalog -->
      <section id="catalog" class="section">
        <h2 class="section-title">패턴 카탈로그</h2>
        <div class="filter-bar" id="filterBar">
          <button class="filter-btn active" data-cat="all">전체</button>
          <button class="filter-btn" data-cat="cognitive">🧠 인지</button>
          <button class="filter-btn" data-cat="rhetorical">🎭 수사</button>
          <button class="filter-btn" data-cat="value">⚖️ 가치</button>
          <button class="filter-btn" data-cat="expressive">✨ 표현</button>
        </div>
        <div class="pattern-grid" id="patternGrid"></div>
      </section>

      <!-- Analysis Timeline -->
      <section id="timeline" class="section">
        <h2 class="section-title">분석 히스토리</h2>
        <div class="timeline" id="timelineList"></div>
      </section>

      <!-- Speaker Map -->
      <section id="speakers" class="section">
        <h2 class="section-title">화자 지형</h2>
        <div class="speaker-grid" id="speakerGrid"></div>
      </section>

    </div>
  </main>

  <footer class="site-footer">
    <p>Daegu Agent Crew · 담화 패턴 분석 대시보드 · <span id="genTime"></span></p>
  </footer>

<script>
(function() {
  'use strict';

  let DATA = null;

  async function loadData() {
    const res = await fetch('data.json');
    DATA = await res.json();
    render();
  }

  function render() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    document.getElementById('genTime').textContent = `생성 ${DATA.meta.generatedAt}`;

    renderStats();
    renderPatterns('all');
    renderTimeline();
    renderSpeakers();

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderPatterns(btn.dataset.cat);
      });
    });
  }

  function renderStats() {
    const m = DATA.meta;
    const items = [
      { label: '총 패턴 수', value: m.totalPatterns, icon: '🧩', color: 'var(--accent)' },
      { label: '누적 빈도', value: m.totalFrequency, icon: '📊', color: '#10b981' },
      { label: '분석 건수', value: m.totalAnalyses, icon: '🔍', color: '#f59e0b' },
      { label: '분석 화자', value: m.totalSpeakers, icon: '👥', color: '#ef4444' }
    ];
    document.getElementById('statGrid').innerHTML = items.map(s => `
      <div class="stat-card">
        <span class="stat-icon">${s.icon}</span>
        <span class="stat-value" style="color:${s.color}">${s.value}</span>
        <span class="stat-label">${s.label}</span>
      </div>
    `).join('');
  }

  function renderPatterns(catFilter) {
    const maxFreq = Math.max(...DATA.patterns.map(p => p.frequency));
    let patterns = DATA.patterns;
    if (catFilter !== 'all') {
      patterns = patterns.filter(p => p.category === catFilter);
    }
    // Sort by frequency descending
    patterns = [...patterns].sort((a, b) => b.frequency - a.frequency);

    document.getElementById('patternGrid').innerHTML = patterns.map(p => {
      const pct = (p.frequency / maxFreq * 100).toFixed(0);
      const newBadge = p.isNew ? '<span class="badge-new">신규</span>' : '';
      return `
        <div class="pattern-card" style="border-left-color:${p.color}">
          <div class="pattern-header">
            <span class="pattern-code" style="background:${p.color}20;color:${p.color}">${p.code}</span>
            <span class="pattern-name">${p.name}</span>
            ${newBadge}
          </div>
          <p class="pattern-desc">${p.description || ''}</p>
          <div class="pattern-freq">
            <div class="freq-bar-track">
              <div class="freq-bar-fill" style="width:${pct}%;background:${p.color}"></div>
            </div>
            <span class="freq-count">${p.frequency}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderTimeline() {
    const analyses = DATA.analyses;
    document.getElementById('timelineList').innerHTML = analyses.map(a => {
      const scores = a.scores ? Object.entries(a.scores).map(([name, score]) => 
        `<span class="score-pill">${name} ${'★'.repeat(Math.round(score))}${'☆'.repeat(5-Math.round(score))}</span>`
      ).join('') : '';
      const sourceLink = a.source ? `<a href="${a.source}" target="_blank" rel="noopener" class="source-link">📎 원본</a>` : '';
      const fileLink = a.exists ? `<a href="https://github.com/Daegu-Agent-Crew/team-memory-kit/blob/main/context/records/${a.file}" target="_blank" rel="noopener" class="source-link">📄 분석</a>` : '';
      return `
        <div class="timeline-item">
          <div class="timeline-date">${a.date}</div>
          <div class="timeline-content">
            <span class="timeline-type">${a.type}</span>
            <h3 class="timeline-title">${a.title}</h3>
            <p class="timeline-speaker">화자: ${a.speaker}</p>
            ${scores ? `<div class="score-row">${scores}</div>` : ''}
            <div class="timeline-links">${sourceLink}${fileLink}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderSpeakers() {
    const speakers = DATA.speakers;
    document.getElementById('speakerGrid').innerHTML = speakers.map(s => `
      <div class="speaker-card">
        <h3 class="speaker-name">${s.name}</h3>
        <div class="speaker-section">
          <span class="speaker-label">주력</span>
          <p class="speaker-patterns">${s.strengths || '-'}</p>
        </div>
        <div class="speaker-section">
          <span class="speaker-label weaknesses">약점</span>
          <p class="speaker-patterns">${s.weaknesses || '-'}</p>
        </div>
      </div>
    `).join('');
  }

  loadData().catch(err => {
    document.getElementById('loading').style.display = 'none';
    const e = document.getElementById('error');
    e.style.display = 'block';
    e.textContent = '데이터 로드 실패: ' + err.message;
  });

  // Mobile menu toggle
  var btn = document.getElementById('menuToggle');
  var nav = document.getElementById('mainNav');
  if(btn && nav) {
    btn.addEventListener('click', function() {
      nav.classList.toggle('open');
      btn.textContent = nav.classList.contains('open') ? '✕' : '☰';
    });
    nav.addEventListener('click', function(e) {
      if(e.target.tagName === 'A') {
        nav.classList.remove('open');
        btn.textContent = '☰';
      }
    });
  }

})();
</script>
</body>
</html>
